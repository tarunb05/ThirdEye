name: tests

# The project's own history is the argument for this file: eight separate
# occasions where a broken pipeline produced plausible numbers and nothing
# failed. Every test here pins one of those behaviours.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # bcrypt is pinned: passlib 1.7.4 raises "password cannot be longer
          # than 72 bytes" against bcrypt >= 4.1, which breaks registration.
          pip install pytest httpx python-dotenv fastapi "uvicorn[standard]" \
                      aiosqlite passlib "bcrypt==4.0.1" python-multipart reportlab
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - name: Type-check and build
        run: npm run build
